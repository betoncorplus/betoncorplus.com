{{ define "main" }}
<main id="main">
	<div class="container">
		<div class="row topspace">
			<div class="col-sm-12">
				<div class="post-grid">
					{{ range .Paginator.Pages }}
					{{ partial "post-card.html" (dict "page" . "label" "Selengkapnya") }}
					{{ end }}
				</div>
			</div>
		</div>
		<center class="">
			<ul class="pagination">
        {{ template "_internal/pagination.html" . }}
			</ul>
		</center>
	</div>	<!-- /container -->
</main>
{{ end }}
